# The Cargo vendor check; docs/dev/cargo-vendor.md says what it proves.
#
# The workspace builds from vendor/, and Cargo checks a vendored file only
# against the checksum record committed beside it. This workflow downloads the
# archive of every crates.io package in Cargo.lock and fails unless each
# vendored crate holds exactly the files of its archive, byte for byte.
#
# It runs for pull requests and pushes to main that change the vendored tree,
# the lock file, the source replacement, the attributes that decide which
# bytes a checkout gets, or the check itself, and on "Run workflow". A change
# to other paths starts no run, so this job must not become a required status
# check: a pull request that starts no run would wait for it without end.
#
# Nothing is cached: every run fetches every archive again, so no stored
# result stands in for a comparison. A failed download fails the run.
name: Cargo vendor

on:
    workflow_dispatch:
    pull_request:
        paths:
            - vendor/**
            - Cargo.lock
            - .cargo/config.toml
            - .gitattributes
            - .github/workflows/cargo-vendor.yml
            - scripts/check-cargo-vendor.py
            - scripts/test-check-cargo-vendor.py
    push:
        branches: [main]
        paths:
            - vendor/**
            - Cargo.lock
            - .cargo/config.toml
            - .gitattributes
            - .github/workflows/cargo-vendor.yml
            - scripts/check-cargo-vendor.py
            - scripts/test-check-cargo-vendor.py

permissions:
    contents: read

# A newer push to the same branch or pull request replaces the run in flight.
concurrency:
    group: cargo-vendor-${{ github.ref }}
    cancel-in-progress: true

defaults:
    run:
        shell: bash

jobs:
    compare:
        name: Vendored crates equal their crates.io archives
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: actions/setup-python@v7
              with:
                  python-version: '3.13'
            - name: Pure tests of the check
              run: python3 -I scripts/test-check-cargo-vendor.py
            - name: Compare vendor/ with the crates.io archives
              run: python3 -I scripts/check-cargo-vendor.py
