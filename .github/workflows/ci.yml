name: CI

on:
    push:
    pull_request:

defaults:
    run:
        shell: bash

env:
    CARGO_TERM_COLOR: always

jobs:
    check:
        name: fmt, clippy, docs, test (${{ matrix.os }})
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        env:
            # No debug info in CI's debug builds. On Linux each of the ~93
            # test binaries would otherwise link its own copy of the full
            # DWARF (split-debuginfo is off there), and CI sets no
            # RUST_BACKTRACE: panic messages take file and line from
            # Location, not debug info. The release tests already run
            # without it.
            CARGO_PROFILE_DEV_DEBUG: none
        steps:
            - uses: actions/checkout@v7
            # GitHub has also run ubuntu jobs on AWS since 28 Oct 2026. Both
            # CI jobs whose log header said "Cloud: AWS" (runs 41716015029 and
            # 42001929664) died while linking test binaries: rust-lld, which
            # collect2 calls "ld", got SIGBUS, which is how a full disk shows
            # up for its mmap'd output. No Azure job failed. Removing unused
            # SDKs frees tens of GB; the df lines record what each runner had.
            - name: Free disk space (Linux)
              if: runner.os == 'Linux'
              run: |
                  df -h /
                  sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
                  df -h /
            - uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt, clippy
            - uses: Swatinem/rust-cache@v2
            - name: JavaScript syntax
              run: |
                  node --check assets/writer/math.js
                  node --check assets/writer/live-reload.js
                  node --check tests/fixtures/live-reload/qa.mjs
            - name: cargo fmt
              run: cargo fmt --check
            - name: cargo clippy
              run: >-
                  cargo clippy --locked --all-targets --all-features --
                  -D warnings
            - name: cargo doc
              run: cargo doc --locked --no-deps
              env:
                  RUSTDOCFLAGS: -D warnings
            - name: plant junk files under assets/
              run: |
                  mkdir -p assets/themes/default
                  touch \
                      assets/vendor/.DS_Store \
                      assets/vendor/katex/._katex.min.js \
                      assets/themes/default/Thumbs.db \
                      assets/writer/.math.js.swp assets/writer/math.js~
            # A hung test fails its step instead of reaching the 6 h job
            # limit. Each limit is about 2-3x the slowest observed step
            # (windows-latest: 10 min debug, 143 min release, mostly LTO).
            - name: cargo test
              timeout-minutes: 30
              run: cargo test --locked --no-fail-fast
            - name: cargo test --release (embedded assets)
              timeout-minutes: 300
              run: cargo test --locked --release --no-fail-fast
            - name: Disk usage
              if: always()
              run: |
                  df -h . || true
                  du -sh target/debug target/release 2>/dev/null || true

    vendor-drift:
        name: vendored assets match scripts/vendor.sh
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: re-run scripts/vendor.sh
              run: scripts/vendor.sh
            - name: check Unicode to LaTeX table
              run: |
                  if test -f scripts/gen-unicode-latex.py; then
                      python3 -I scripts/gen-unicode-latex.py --check
                  else
                      echo "skipping Unicode to LaTeX generation check (T51)"
                  fi
            - name: fail on drift
              run: |
                  git diff --exit-code
                  test -z "$(git status --porcelain)"
