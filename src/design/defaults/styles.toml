# Layer 0, named styles (R13 §4.2 and §4.3). Inside a style, em is of the
# style's own size; a style's size in em is of text.size. Each style belongs
# to one group, named above it.

# HEADINGS (T109): headings, title block and contents.

[design.styles."Heading 1"]
font           = "heading"
size           = "1.85em"
weight         = "bold"
color          = "text"
line_height    = 1.25
space_before   = "2em"                    # D12
space_after    = "0.65em"
keep_with_next = true

[design.styles."Heading 2"]
font           = "heading"
size           = "1.45em"
weight         = "bold"
color          = "text"
line_height    = 1.25
space_before   = "2em"
space_after    = "0.65em"
keep_with_next = true

[design.styles."Heading 3"]
font           = "heading"
size           = "1.2em"
weight         = "bold"
color          = "text"
line_height    = 1.25
space_before   = "2em"
space_after    = "0.65em"
keep_with_next = true

[design.styles."Heading 4"]
font           = "heading"
size           = "1em"
weight         = "bold"
color          = "text"
line_height    = 1.25
space_before   = "2em"
space_after    = "0.65em"
keep_with_next = true

[design.styles."Heading 5"]
font           = "heading"
size           = "1em"
weight         = "bold"
color          = "text"
line_height    = 1.25
space_before   = "2em"
space_after    = "0.65em"
keep_with_next = true

[design.styles."Heading 6"]
font           = "heading"
size           = "1em"
weight         = "bold"
color          = "text"
line_height    = 1.25
space_before   = "2em"
space_after    = "0.65em"
keep_with_next = true

[design.styles.Title]
font   = "heading"
size   = "2.4em"
weight = "bold"
align  = "center"

[design.styles.Subtitle]
font  = "heading"
size  = "1.2em"
color = "muted"
align = "center"

[design.styles.Author]
size  = "1em"
align = "center"

[design.styles.Date]
size  = "1em"
color = "muted"
align = "center"

[design.styles."Abstract Title"]
size           = "0.85em"
weight         = "bold"
case           = "upper"
letter_spacing = "0.08em"

[design.styles.Abstract]
indent = "3.5em"

# TOC Heading is an unlisted Heading 1.
[design.styles."TOC Heading"]
font           = "heading"
size           = "1.85em"
weight         = "bold"
color          = "text"
line_height    = 1.25
space_before   = "2em"
space_after    = "0.65em"
keep_with_next = true

[design.styles."toc 1"]
font        = "body"
size        = "1em"
space_after = "0.25em"
indent      = { left = "0em" }

[design.styles."toc 2"]
font        = "body"
size        = "1em"
space_after = "0.25em"
indent      = { left = "1.2em" }

[design.styles."toc 3"]
font        = "body"
size        = "1em"
space_after = "0.25em"
indent      = { left = "2.4em" }

# CAPTIONS (T110). Image and table captions lay their keys over Caption's.

[design.styles.Caption]
size   = "0.9em"
color  = "muted"
italic = false
align  = "left"

[design.styles."Image Caption"]
align        = "center"
space_before = "0.6em"

[design.styles."Table Caption"]
align       = "left"
space_after = "0.6em"

# QUOTES (T112): block quotes, rules and definition lists. Block Text keeps
# the body's spaces.

[design.styles."Block Text"]
color  = "muted"
indent = "0pt"
border = { side = "left", width = "1.5pt", color = "border", gap = "1.25em" }

[design.styles."Horizontal Rule"]
border       = { side = "top", width = "0.75pt", color = "border" }
space_before = "2em"
space_after  = "2em"

[design.styles."Definition Term"]
weight         = "bold"
keep_with_next = true

[design.styles.Definition]
indent       = { left = "1.5em" }
space_before = "0.25em"

# CODE (T113). Source Code keeps the body's spaces.

[design.styles."Source Code"]
font        = "mono"
size        = "0.85em"
line_height = 1.5

# TABLES (T114): Compact's spaces are a cell's y inset.

[design.styles.Compact]
space_before = "0.5em"
space_after  = "0.5em"

# FOOTNOTES (T115): footnotes and the bibliography.

[design.styles."Footnote Text"]
size = "0.9em"

[design.styles.Bibliography]
size        = "0.95em"
space_after = "0.75em"
indent      = { left = "2em" }

# PAGE_NUMBERS (T116): Word's furniture paragraph styles.

[design.styles.Header]
size  = "1em"
color = "text"

[design.styles.Footer]
size  = "0.75em"
color = "muted"

# DIV_CLASSES (T117): the div classes writer styles itself.

[design.styles.center]
align = "center"

[design.styles.left]
align = "left"

[design.styles.right]
align = "right"

[design.styles.small]
size = "0.85em"

[design.styles.large]
size = "1.25em"
