<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>
{% if meta.description %}<meta name="description" content="{{ meta.description }}">{% endif %}
{% for author in meta.authors %}<meta name="author" content="{{ author.name }}">{% endfor %}
{% if meta.keywords %}<meta name="keywords" content="{{ meta.keywords|join(', ') }}">{% endif %}
